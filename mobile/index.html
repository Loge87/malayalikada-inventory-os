<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Malayalikada Inventory OS</title>
    <style>
      :root { color-scheme: light dark; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
        background: #fafafa;
        color: #18181b;
      }
      @media (prefers-color-scheme: dark) {
        html, body { background: #09090b; color: #fafafa; }
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
      }
      h1 { font-size: 1.125rem; font-weight: 600; margin: 0; }
      p { margin: 0; opacity: 0.65; font-size: 0.875rem; max-width: 22rem; }
      .spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid currentColor; border-top-color: transparent;
        opacity: 0.5; animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!--
      This is the bundled web asset Capacitor falls back to. In normal operation
      the native shell loads the deployed Next.js app via `server.url` in
      capacitor.config.ts (the app is entirely server-rendered and cannot be
      statically exported — see the commit message / mobile notes).
    -->
    <main>
      <div class="spinner"></div>
      <h1>Malayalikada Inventory OS</h1>
      <p>
        Connecting to the server. If this screen stays up, check your connection
        or that <code>server.url</code> is configured for this build.
      </p>
    </main>
  </body>
</html>
